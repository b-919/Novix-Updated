buildscript {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

task setupUCore {
    description = 'Clones the uCore version Novix targets into the local uCore directory.'
    group = 'setup'
    doLast {
        def ucoreDir = file('uCore')
        if (ucoreDir.exists()) {
            println 'uCore already exists. Skipping clone.'
        } else {
            println 'Cloning uCore @ 77506a6...'
            ant.exec(executable: 'git', dir: rootDir) {
                arg(value: 'clone')
                arg(value: 'https://github.com/Anuken/uCore.git')
                arg(value: 'uCore')
            }
            ant.exec(executable: 'git', dir: ucoreDir) {
                arg(value: '-c')
                arg(value: 'core.protectNTFS=false')
                arg(value: 'checkout')
                arg(value: '77506a6')
            }
            println 'uCore is ready for local compilation.'
        }
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "Novix"
        gdxVersion = '1.9.6'
        uCoreVersion = '77506a6'
    }

    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url 'https://jitpack.io' }
    }
}

project(":desktop") {
    apply plugin: "java"


    dependencies {
        implementation project(":core")
        if (new File(rootDir, 'uCore').exists()) {
            implementation project(":uCore")
        } else {
            implementation "com.github.Anuken:ucore:$uCoreVersion"
        }
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java"


    dependencies {
        if (new File(rootDir, 'uCore').exists()) {
            implementation project(":uCore")
        } else {
            implementation "com.github.Anuken:ucore:$uCoreVersion"
        }
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    }
}

project(":android") {
    apply plugin: "com.android.application"

    configurations { natives }

    dependencies {
        implementation project(":core")
        if (new File(rootDir, 'uCore').exists()) {
            implementation project(":uCore")
        } else {
            implementation "com.github.Anuken:ucore:$uCoreVersion"
        }
        implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    }
}

tasks.eclipse.doLast {
    delete ".project"
}
